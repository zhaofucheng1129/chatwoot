# 仅启动开发依赖(Postgres + Redis + Mailhog),Rails/Sidekiq/Vite 跑在本地原生环境
# 用法: docker compose -f docker-compose.dev-deps.yaml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16   # Captain AI 的向量检索需要 pgvector
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=chatwoot_dev
      - POSTGRES_USER=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust   # 本地开发免密码
    volumes:
      - cw_dev_postgres:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - cw_dev_redis:/data

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI: http://localhost:8025

volumes:
  cw_dev_postgres:
  cw_dev_redis:
